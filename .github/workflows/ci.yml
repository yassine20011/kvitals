name: Lint & Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: shellcheck install.sh install-remote.sh package.sh tests/*.sh

  build:
    name: Build .plasmoid
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build package
        run: bash package.sh

      - name: Verify package exists
        run: ls -lh *.plasmoid

  unit-test:
    name: Node logic & contract tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage --prefix tests

  plasma-test:
    name: Plasma 6 native tests
    runs-on: ubuntu-latest
    needs: build
    container:
      image: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install Plasma 6 and Qt 6 test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git plasma-sdk qt6-declarative-dev-tools \
            qml6-module-qttest qml6-module-org-kde-ksysguard xvfb dbus-x11

      - uses: actions/checkout@v4

      - name: Lint QML
        run: bash tests/lint_qml.sh

      - name: Run Qt Quick component tests
        run: bash tests/run_qml_tests.sh

      - name: Run Plasma form-factor smoke matrix
        run: bash tests/smoke_test.sh
